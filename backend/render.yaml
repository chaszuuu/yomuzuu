services:
  # ── Flask Backend ────────────────────────────────────────────────────────────
  - type: web
    name: yomuzuu-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yomuzuu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: yomuzuu-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false   # set this manually in Render dashboard
      - key: API_KEY
        generateValue: true   # Render auto-generates a secret for you

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: yomuzuu-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set this to your backend URL in Render dashboard
      - key: VITE_API_KEY
        sync: false   # same value as API_KEY above

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: yomuzuu-db
    databaseName: yomuzuu
    user: yomuzuu

# ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: yomuzuu-redis
    plan: free

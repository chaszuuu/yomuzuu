name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: pytest ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yomuzuu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yomuzuu_test
      DATABASE_URL_test: postgresql://postgres:postgres@localhost:5432/yomuzuu_test
      API_KEY: ""
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-flask

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v


  # ─── Frontend: Playwright E2E ───────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests  # only run E2E if backend tests pass
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yomuzuu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yomuzuu
      API_KEY: ""
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Seed test data
        working-directory: backend
        run: |
          python -c "
          from database import init_db, SessionLocal
          from models import Manga
          from datetime import datetime
          init_db()
          db = SessionLocal()
          if not db.query(Manga).filter(Manga.title == 'One Piece').first():
              db.add(Manga(
                  title='One Piece',
                  cover='https://cdn.myanimelist.net/images/manga/2/253146.jpg',
                  description='Gol D. Roger was known as the Pirate King.',
                  genres='Action,Adventure,Fantasy',
                  score='9.1',
                  type='manga',
                  source_url='https://myanimelist.net/manga/13',
                  available=True,
                  status='ONGOING',
                  last_synced_at=datetime.utcnow(),
              ))
              db.commit()
              print('Seeded One Piece')
          db.close()
          "

      - name: Start Flask backend
        working-directory: backend
        run: |
          python app.py &
          echo "Waiting for backend..."
          sleep 5
          curl -f http://localhost:5000/api/manga || exit 1
        env:
          FLASK_ENV: development

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7